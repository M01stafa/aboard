<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  @font-face { font-family: Geist; src: url(geist-latin-wght-normal.woff2) format("woff2"); font-weight: 100 900; }
  html, body { margin: 0; background: #050B17; }
  canvas { display: block; }
</style>
<script type="importmap">
{ "imports": { "three": "./node_modules/three/build/three.module.js", "three/addons/": "./node_modules/three/examples/jsm/" } }
</script>
</head>
<body>
<canvas id="out"></canvas>
<script type="module">
import * as THREE from "three";
import { RoundedBoxGeometry } from "three/addons/geometries/RoundedBoxGeometry.js";

// Alpha design-system tokens (Aboard DESIGN.md v2.1.1)
const C = {
  night: "#050B17", surface: "#0C162C", subtle: "#142343", ivory: "#EDEAE1", muted: "#8FA2C4",
  tech: "#4F9ED5", tech3: "#8BC4EC", gold: "#D4AF37", gold3: "#E7CF7E", blue6: "#2558D0",
  blue3: "#8FB2FF", royal: "#002C8C", bronze: "#B88564", danger: "#F87171", edge: "#1B2F58",
};
const W = 1280, H = 640, SS = 1.5;               // output size and supersampling
const P = new URLSearchParams(location.search);

await document.fonts.load("700 40px Geist"); await document.fonts.load("400 20px Geist");

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(SS);
renderer.setSize(W, H, false);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.outputColorSpace = THREE.SRGBColorSpace;

const scene = new THREE.Scene();
scene.background = new THREE.Color(C.night);
scene.fog = new THREE.Fog(C.night, 16, 34);

const camera = new THREE.PerspectiveCamera(34, W / H, 0.1, 100);

// ---------- lights
scene.add(new THREE.AmbientLight(0xffffff, 0.55));
const key = new THREE.DirectionalLight(0xffffff, 1.4); key.position.set(3, 8, 10); scene.add(key);
const rimBlue = new THREE.PointLight(C.tech, 60, 30); rimBlue.position.set(-7, 3, 2); scene.add(rimBlue);
const rimGold = new THREE.PointLight(C.gold, 40, 30); rimGold.position.set(7, 2, 3); scene.add(rimGold);

// ---------- floor grid with radial fade
{
  const g = new THREE.GridHelper(60, 60, C.tech, C.tech);
  g.material.transparent = true; g.material.opacity = 0.12; g.position.y = -2.25; scene.add(g);
  const cv = document.createElement("canvas"); cv.width = cv.height = 512;
  const x = cv.getContext("2d"); const gr = x.createRadialGradient(256, 256, 0, 256, 256, 256);
  gr.addColorStop(0, "rgba(37,88,208,0.30)"); gr.addColorStop(1, "rgba(79,158,213,0)");
  x.fillStyle = gr; x.fillRect(0, 0, 512, 512);
  const glow = new THREE.Mesh(new THREE.PlaneGeometry(18, 18), new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(cv), transparent: true, depthWrite: false, fog: false, toneMapped: false }));
  glow.rotation.x = -Math.PI / 2; glow.position.y = -2.24; scene.add(glow);
}

// ---------- panel textures (2D canvases redrawn every frame)
const TW = 1024, TH = 704;
function panelCanvas() { const c = document.createElement("canvas"); c.width = TW; c.height = TH; return c; }
function rr(x, X, Y, w, h, r) { x.beginPath(); x.roundRect(X, Y, w, h, r); }
function chrome(x, title, color) {
  x.fillStyle = C.surface; x.fillRect(0, 0, TW, TH);
  x.fillStyle = color + "22"; x.fillRect(0, 0, TW, 88);
  x.fillStyle = color; x.beginPath(); x.arc(52, 44, 12, 0, Math.PI * 2); x.fill();
  x.font = "700 40px Geist"; x.fillStyle = color; x.fillText(title, 84, 58);
  x.strokeStyle = color + "55"; x.lineWidth = 3; x.beginPath(); x.moveTo(0, 88); x.lineTo(TW, 88); x.stroke();
}
function drawBoard(x, t) {
  chrome(x, "Whiteboard", C.tech);
  x.fillStyle = C.tech + "30";
  for (let i = 40; i < TW; i += 48) for (let j = 128; j < TH; j += 48) x.fillRect(i, j, 4, 4);
  x.lineCap = "round"; x.lineJoin = "round";
  const prog = (t * 1.2) % 1;                           // pen progress for the live stroke
  x.strokeStyle = C.tech3; x.lineWidth = 9; x.beginPath();
  for (let k = 0; k <= 200; k++) { const u = k / 200; const X = 80 + u * 860, Y = 270 - 90 * Math.sin(u * Math.PI * 3); k ? x.lineTo(X, Y) : x.moveTo(X, Y); }
  x.stroke();
  x.font = "500 52px Geist"; x.fillStyle = C.ivory; x.fillText("V = I · R", 90, 470);
  x.strokeStyle = C.gold; x.lineWidth = 7; x.beginPath(); x.moveTo(90, 492); x.lineTo(330, 492); x.stroke();
  x.strokeStyle = C.ivory; x.lineWidth = 8; x.beginPath();
  const n = Math.max(1, Math.floor(prog * 8));
  for (let k = 0; k <= n; k++) { const X = 520 + k * 52, Y = k % 2 ? 420 : 520; k ? x.lineTo(X, Y) : x.moveTo(X, Y); }
  x.stroke();
  // imported PDF page thumbnail pinned on the board
  x.fillStyle = C.ivory; rr(x, 760, 560, 180, 110, 10); x.fill();
  x.fillStyle = "#8FA2C4"; for (let k = 0; k < 4; k++) x.fillRect(780, 582 + k * 20, 140 - (k % 2) * 40, 8);
  x.fillStyle = C.gold + "99"; x.fillRect(778, 600, 110, 14);
}
function drawPdf(x, t) {
  chrome(x, "PDF", C.gold);
  x.fillStyle = C.ivory; rr(x, 120, 120, TW - 240, TH - 150, 12); x.fill();
  x.font = "700 34px Geist"; x.fillStyle = "#0B132B"; x.fillText("Lecture 7 — Transient response", 160, 180);
  for (let k = 0; k < 12; k++) { x.fillStyle = "#5C677D"; x.fillRect(160, 220 + k * 34, 560 - ((k * 53) % 180), 12); }
  const sweep = Math.min(1, ((t * 1.0) % 1) * 1.6);       // highlighter sweep
  x.fillStyle = "rgba(212,175,55,0.55)"; x.fillRect(152, 280, 520 * sweep, 30);
  x.strokeStyle = C.danger; x.lineWidth = 6; x.lineCap = "round"; x.beginPath();
  for (let k = 0; k <= 60; k++) { const X = 160 + k * 8, Y = 512 + 8 * Math.sin(k / 3); k ? x.lineTo(X, Y) : x.moveTo(X, Y); }
  x.stroke();
  x.fillStyle = C.gold; rr(x, 720, 470, 120, 120, 12); x.fill();
  x.fillStyle = C.surface; x.fillRect(744, 500, 72, 10); x.fillRect(744, 524, 56, 10);
}
function drawCircuit(x, t) {
  chrome(x, "Circuit", C.blue3);
  x.strokeStyle = C.blue3; x.lineWidth = 6; x.lineJoin = "round"; x.beginPath();
  x.moveTo(120, 200); x.lineTo(320, 200);
  for (let k = 0; k < 6; k++) x.lineTo(340 + k * 24, k % 2 ? 230 : 170);
  x.lineTo(500, 200); x.lineTo(700, 200); x.lineTo(700, 300); x.moveTo(120, 200); x.lineTo(120, 300);
  x.moveTo(90, 300); x.lineTo(150, 300); x.moveTo(104, 318); x.lineTo(136, 318);
  x.moveTo(670, 300); x.lineTo(730, 300); x.moveTo(670, 318); x.lineTo(730, 318); x.stroke();
  // current dots moving along the wire
  x.fillStyle = C.gold;
  for (let k = 0; k < 6; k++) { const u = ((t * 0.8 + k / 6) % 1); x.beginPath(); x.arc(120 + u * 580, 200, 9, 0, 7); x.fill(); }
  // oscilloscope
  const sx = 80, sy = 370, sw = TW - 160, sh = 290;
  x.fillStyle = C.night; rr(x, sx, sy, sw, sh, 14); x.fill();
  x.strokeStyle = C.blue3 + "33"; x.lineWidth = 2;
  for (let k = 1; k < 8; k++) { x.beginPath(); x.moveTo(sx + k * sw / 8, sy); x.lineTo(sx + k * sw / 8, sy + sh); x.stroke(); }
  for (let k = 1; k < 4; k++) { x.beginPath(); x.moveTo(sx, sy + k * sh / 4); x.lineTo(sx + sw, sy + k * sh / 4); x.stroke(); }
  x.save(); rr(x, sx, sy, sw, sh, 14); x.clip();
  x.strokeStyle = C.tech3; x.lineWidth = 6; x.beginPath();
  for (let k = 0; k <= 300; k++) { const u = k / 300; const X = sx + u * sw; const Y = sy + sh / 2 - 100 * Math.sin(2 * Math.PI * (u * 2.5 - t)) * Math.exp(-0.0 * u); k ? x.lineTo(X, Y) : x.moveTo(X, Y); }
  x.stroke();
  x.strokeStyle = C.gold; x.lineWidth = 4; x.beginPath();
  for (let k = 0; k <= 300; k++) { const u = k / 300; const X = sx + u * sw; const Y = sy + sh / 2 - 60 * Math.cos(2 * Math.PI * (u * 2.5 - t)); k ? x.lineTo(X, Y) : x.moveTo(X, Y); }
  x.stroke(); x.restore();
}

function makePanel(draw, color, pos, rotY) {
  const cv = panelCanvas(); const tex = new THREE.CanvasTexture(cv); tex.colorSpace = THREE.SRGBColorSpace; tex.anisotropy = 8;
  const geo = new RoundedBoxGeometry(3.3, 2.27, 0.1, 6, 0.09);
  const side = new THREE.MeshStandardMaterial({ color: C.subtle, metalness: 0.6, roughness: 0.35 });
  const face = new THREE.MeshStandardMaterial({ map: tex, emissiveMap: tex, emissive: 0xffffff, emissiveIntensity: 0.55, roughness: 0.45, metalness: 0.1 });
  // RoundedBoxGeometry has no material groups: use a plane for the face on top of the box body
  const body = new THREE.Mesh(geo, side);
  const plane = new THREE.Mesh(new THREE.PlaneGeometry(3.18, 2.17), face); plane.position.z = 0.052;
  const edge = new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.PlaneGeometry(3.3, 2.27)), new THREE.LineBasicMaterial({ color, transparent: true, opacity: 0.9 }));
  edge.position.z = 0.056;
  const g = new THREE.Group(); g.add(body, plane, edge); g.position.copy(pos); g.rotation.y = rotY; scene.add(g);
  return { g, cv, tex, draw, base: pos.clone() };
}
const panels = [
  makePanel(drawPdf, C.gold, new THREE.Vector3(-3.75, 0.15, -0.9), 0.38),
  makePanel(drawBoard, C.tech, new THREE.Vector3(0, 0.3, 0), 0),
  makePanel(drawCircuit, C.blue3, new THREE.Vector3(3.75, 0.15, -0.9), -0.38),
];

// ---------- cross-tool actions: a PDF page and a circuit snapshot fly onto the board
const links = [];
function cardTexture(kind) {
  const c = document.createElement("canvas"); c.width = 256; c.height = 180; const x = c.getContext("2d");
  if (kind === "pdf") {
    x.fillStyle = C.ivory; x.beginPath(); x.roundRect(0, 0, 256, 180, 14); x.fill();
    x.fillStyle = "#5C677D"; for (let k = 0; k < 6; k++) x.fillRect(24, 26 + k * 24, 200 - (k % 3) * 40, 9);
    x.fillStyle = "rgba(212,175,55,0.7)"; x.fillRect(20, 46, 150, 16);
  } else {
    x.fillStyle = C.night; x.beginPath(); x.roundRect(0, 0, 256, 180, 14); x.fill();
    x.strokeStyle = C.blue3; x.lineWidth = 3; x.strokeRect(2, 2, 252, 176);
    x.strokeStyle = C.tech3; x.lineWidth = 5; x.beginPath();
    for (let k = 0; k <= 60; k++) { const X = 16 + k * 3.7, Y = 90 - 50 * Math.sin(k / 60 * Math.PI * 4); k ? x.lineTo(X, Y) : x.moveTo(X, Y); }
    x.stroke();
  }
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}
function link(a, ctrl, b, color, kind, phase) {
  const curve = new THREE.QuadraticBezierCurve3(a, ctrl, b);
  scene.add(new THREE.Mesh(new THREE.TubeGeometry(curve, 64, 0.008, 6), new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.35 })));
  const dots = [];
  for (let k = 0; k < 4; k++) {
    const m = new THREE.Mesh(new THREE.SphereGeometry(0.035, 12, 12), new THREE.MeshBasicMaterial({ color }));
    m.add(new THREE.Mesh(new THREE.SphereGeometry(0.075, 12, 12), new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.25 })));
    scene.add(m); dots.push(m);
  }
  const card = new THREE.Mesh(new THREE.PlaneGeometry(0.78, 0.55), new THREE.MeshBasicMaterial({ map: cardTexture(kind), transparent: true, toneMapped: false }));
  scene.add(card);
  links.push({ curve, dots, card, phase });
}
link(new THREE.Vector3(-2.7, 0.35, -0.25), new THREE.Vector3(-1.9, 1.35, 1.6), new THREE.Vector3(-0.75, -0.05, 0.12), C.gold, "pdf", 0);
link(new THREE.Vector3(2.7, 0.35, -0.25), new THREE.Vector3(1.9, 1.35, 1.6), new THREE.Vector3(0.75, -0.05, 0.12), C.tech3, "circuit", 0.5);

// ---------- the .alpha container (rotating cube) under the workspace
const alpha = new THREE.Group();
{
  const outer = new THREE.Mesh(new RoundedBoxGeometry(0.72, 0.72, 0.72, 4, 0.06),
    new THREE.MeshStandardMaterial({ color: C.blue6, emissive: C.royal, emissiveIntensity: 0.6, metalness: 0.2, roughness: 0.2, transparent: true, opacity: 0.35, depthWrite: false }));
  const edges = new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.BoxGeometry(0.74, 0.74, 0.74)), new THREE.LineBasicMaterial({ color: C.gold }));
  const core = new THREE.Mesh(new THREE.IcosahedronGeometry(0.2, 0), new THREE.MeshStandardMaterial({ color: C.gold, emissive: C.gold, emissiveIntensity: 1.1, metalness: 0.6, roughness: 0.25, flatShading: true }));
  alpha.add(outer, edges, core);
  alpha.position.set(0, -1.4, 1.2);
  scene.add(alpha);
  const lc = document.createElement("canvas"); lc.width = 512; lc.height = 128; const lx = lc.getContext("2d");
  lx.font = "700 64px Geist"; lx.fillStyle = C.gold3; lx.textAlign = "center"; lx.fillText(".alpha", 256, 84);
  const label = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(lc), transparent: true }));
  label.scale.set(1.1, 0.275, 1); label.position.set(0, -2.12, 1.2); scene.add(label);
}

// ---------- particles
{
  const n = 500, pos = new Float32Array(n * 3);
  let s = 7; const rnd = () => (s = (s * 16807) % 2147483647) / 2147483647;
  for (let i = 0; i < n; i++) { pos[i * 3] = (rnd() - 0.5) * 24; pos[i * 3 + 1] = rnd() * 9 - 2; pos[i * 3 + 2] = (rnd() - 0.5) * 16 - 3; }
  const geo = new THREE.BufferGeometry(); geo.setAttribute("position", new THREE.BufferAttribute(pos, 3));
  const pts = new THREE.Points(geo, new THREE.PointsMaterial({ color: C.tech3, size: 0.035, transparent: true, opacity: 0.7 }));
  pts.name = "pts"; scene.add(pts);
}

// ---------- 2D overlay compositor (title)
const out = document.getElementById("out"); out.width = W * SS; out.height = H * SS;
const ox = out.getContext("2d");
const logo = new Image(); logo.src = "logo.png"; await logo.decode();

window.renderFrame = (t /* 0..1 loop phase */) => {
  const a = 2 * Math.PI * t;
  camera.position.set(Math.sin(a) * 0.9, 1.5 + Math.sin(a * 2) * 0.12, 9.9 + Math.cos(a) * 0.3);
  camera.lookAt(0, -0.05, 0);
  panels.forEach((p, i) => {
    p.draw(p.cv.getContext("2d"), t); p.tex.needsUpdate = true;
    p.g.position.y = p.base.y + Math.sin(a + i * 2.1) * 0.08;
  });
  links.forEach((l) => {
    l.dots.forEach((d, k) => { const u = (t * 2 + k / 4) % 1; d.position.copy(l.curve.getPoint(u)); });
    const u = (t + l.phase) % 1, e = Math.min(1, Math.max(0, (u - 0.1) / 0.6));     // fly during 10–70 % of the loop
    const s = e * e * (3 - 2 * e);
    l.card.position.copy(l.curve.getPoint(s)); l.card.lookAt(camera.position);
    l.card.material.opacity = u < 0.1 ? u / 0.1 : u > 0.85 ? Math.max(0, (1 - u) / 0.15) : 1;
    l.card.scale.setScalar(1 - 0.45 * s);
  });
  alpha.rotation.set(0.5 + Math.sin(a) * 0.1, a + 0.7, 0);
  scene.getObjectByName("pts").rotation.y = a * 0.05;
  renderer.render(scene, camera);

  ox.drawImage(renderer.domElement, 0, 0);
  ox.save(); ox.scale(SS, SS);
  const top = ox.createLinearGradient(0, 0, 0, 170); top.addColorStop(0, "rgba(5,11,23,0.92)"); top.addColorStop(1, "rgba(5,11,23,0)");
  ox.fillStyle = top; ox.fillRect(0, 0, W, 170);
  ox.textAlign = "center";
  const lw = 58; ox.font = "700 48px Geist"; const tw = ox.measureText("Aboard").width;
  const gx = W / 2 - (lw + 16 + tw) / 2;
  ox.drawImage(logo, gx, 28, lw, lw);
  ox.textAlign = "left"; ox.fillStyle = C.ivory; ox.fillText("Aboard", gx + lw + 16, 74);
  ox.textAlign = "center"; ox.font = "400 20px Geist"; ox.fillStyle = C.muted;
  ox.fillText("Whiteboard · PDF annotator · Circuit simulator — one workspace, your own Google Drive", W / 2, 118);
  // accent line (gradient-accent: gold → tech → royal)
  const gl = ox.createLinearGradient(0, 0, W, 0); gl.addColorStop(0, C.gold); gl.addColorStop(0.5, C.tech); gl.addColorStop(1, C.royal);
  ox.fillStyle = gl; ox.fillRect(0, 0, W, 3);
  ox.restore();
  return out.toDataURL("image/png");
};
window.ready = true;
</script>
</body>
</html>
